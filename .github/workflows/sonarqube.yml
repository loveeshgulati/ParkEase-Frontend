name: SonarQube Analysis - Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonarqube:
    name: SonarQube Scan (Angular)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for SonarQube blame info

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate SonarQube Secrets
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN_FRONTEND }}" ]; then
            echo "::error::SONAR_TOKEN_FRONTEND secret is missing. Please set it in GitHub Repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run tests with coverage
        run: |
          # Check if test target exists in angular.json before running
          if grep -q '"test":' angular.json; then
            npx ng test --watch=false --browsers=ChromeHeadless --code-coverage
          else
            echo "No test target found in angular.json. Skipping tests and coverage generation."
          fi

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONTEND }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}

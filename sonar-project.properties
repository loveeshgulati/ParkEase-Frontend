# =====================================================
# SonarQube Configuration - ParkEase Frontend (Angular 17)
# =====================================================

sonar.projectKey=parkease-frontend
sonar.projectName=ParkEase Frontend
sonar.projectVersion=1.0

# SonarQube server
sonar.host.url=http://localhost:9000
# Set your token here OR pass via -Dsonar.login on CLI
# sonar.login=<YOUR_FRONTEND_TOKEN>

# Sources and tests
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# Coverage report (lcov generated by ng test --code-coverage)
sonar.javascript.lcov.reportPaths=coverage/parkease-frontend/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/*.spec.ts,src/environments/**,src/main.ts
sonar.coverage.exclusions=**/*.spec.ts,src/main.ts,src/environments/**

# TypeScript settings
sonar.typescript.tsconfigPath=tsconfig.json
sonar.sourceEncoding=UTF-8
